  <style>
    :root { color-scheme: light; --ink:#17201f; --paper:#f4efe4; --gold:#b08b3e; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--ink); background:radial-gradient(circle at 15% 12%,rgba(20,35,34,.13),transparent 28%),radial-gradient(circle at 90% 78%,rgba(30,30,30,.10),transparent 32%),var(--paper); font-family: Georgia,"Noto Serif TC",serif; }
    main { max-width:960px; margin:0 auto; padding:56px 24px 72px; }
    .ink-card { position:relative; overflow:hidden; padding:48px 42px; border:1px solid rgba(23,32,31,.25); border-radius:8px 24px 10px 30px; background:rgba(255,252,244,.7); box-shadow:0 20px 60px rgba(21,28,27,.12); }
    .ink-card:before { content:""; position:absolute; width:280px; height:180px; top:-95px; right:-50px; background:rgba(23,32,31,.08); filter:blur(24px); border-radius:50%; transform:rotate(-18deg); }
    header { display:flex; align-items:center; gap:18px; }
    img { width:82px; height:82px; object-fit:cover; border-radius:50%; border:3px solid var(--ink); }
    .eyebrow { letter-spacing:.22em; font-size:12px; color:#6f5a2d; }
    h1 { margin:8px 0 0; font-size:clamp(36px,7vw,68px); letter-spacing:.04em; }
    h2 { margin:42px 0 12px; font-size:25px; }
    p { max-width:680px; line-height:1.9; font-size:17px; }
    .actions { display:flex; flex-wrap:wrap; gap:14px; margin-top:30px; }
    a.button { display:inline-block; padding:13px 22px; border-radius:3px 12px 4px 10px; text-decoration:none; font-weight:700; }
    .primary { color:#fffdf5; background:var(--ink); }
    .secondary { color:var(--ink); border:1px solid rgba(23,32,31,.45); background:rgba(255,255,255,.4); }
    footer { margin-top:30px; color:#596360; font-size:13px; }
  </style>
</head>
<body>
  <main>
    <section class="ink-card">
      <header>
        <img src="LogoTaiji.png" alt="St. Taiji 太極 Logo">
        <div><div class="eyebrow">INK WASH · ACUPOINT KNOWLEDGE</div><h1>St. Taiji</h1></div>

      <div class="actions">

    </section>
  </main>
